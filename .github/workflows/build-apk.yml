name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: Java executable could not be detected on PATH."
            exit 1
          fi
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VERSION_LINE=$(java -version 2>&1 | head -n 1)
          RAW_VER=$(echo "$JAVA_VERSION_LINE" | sed -E 's/.*version "([^"]+)".*/\1/')
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "$JAVA_VERSION_LINE" ]; then
            echo "ERROR: Could not parse active Java version from: $JAVA_VERSION_LINE"
            exit 1
          fi
          if [[ "$RAW_VER" == 1.* ]]; then
            MAJOR_VER=$(echo "$RAW_VER" | cut -d'.' -f2)
          else
            MAJOR_VER=$(echo "$RAW_VER" | cut -d'.' -f1)
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Detected Java major version is invalid: $MAJOR_VER"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name "sdkmanager" 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager executable not found under ${SDK_ROOT}/cmdline-tools"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi

          echo "Using Android SDK at: $SDK_ROOT"
          echo "Using sdkmanager at: $SDKMANAGER"

          mkdir -p "${SDK_ROOT}/licenses"
          touch "${SDK_ROOT}/repositories.cfg"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          LICENSE_RC=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_RC" -ne 0 ]; then
            echo "ERROR: sdkmanager --licenses exited with code $LICENSE_RC"
            exit "$LICENSE_RC"
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          INSTALL_RC=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$INSTALL_RC" -ne 0 ]; then
            echo "ERROR: sdkmanager --install failed with exit code $INSTALL_RC"
            exit "$INSTALL_RC"
          fi

          if [ ! -d "${SDK_ROOT}/platforms/android-35" ]; then
            echo "ERROR: Required SDK platform not found at ${SDK_ROOT}/platforms/android-35"
            exit 1
          fi
          if [ ! -d "${SDK_ROOT}/build-tools/35.0.0" ]; then
            echo "ERROR: Required build-tools not found at ${SDK_ROOT}/build-tools/35.0.0"
            exit 1
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:+${JAVA_HOME}/bin/}keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            KEYTOOL_BIN=$(command -v keytool || true)
          fi
          if [ -z "$KEYTOOL_BIN" ]; then
            echo "ERROR: keytool from the configured Java installation was not found."
            exit 1
          fi
          if [ ! -f ./debug.keystore ]; then
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Build debug APK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          if [ -x ./gradlew ]; then
            ./gradlew --version
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle --version
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH exists but is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "ERROR: $APK_PATH does not have a .apk extension."
            exit 1
          fi
          echo "Verified debug APK at $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          TARGET_APK="${RELEASE_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$TARGET_APK"
          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Failed to prepare release asset at $TARGET_APK"
            exit 1
          fi
          echo "asset_path=${TARGET_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: "Debug APK Build #${{ github.run_number }}"
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK asset is missing or empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]] || [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          NOTES_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")
          cat <<EOF > "$NOTES_FILE"
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run:** #${RUN_NUMBER} (Attempt ${RUN_ATTEMPT})
          - **Source Commit SHA:** \`${SOURCE_SHA}\`
          - **Purpose:** Intended for testing only — this is **not** a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$SOURCE_SHA" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: "Debug APK Build #${{ github.run_number }}"
        run: |
          set -euo pipefail
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release published successfully."
            gh release view "$RELEASE_TAG"
            echo "Release tag: $RELEASE_TAG"
            echo "Release title: $RELEASE_TITLE"
            echo "Release page URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "APK filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"
            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** The GitHub Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: ${RELEASE_OUTCOME})."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded (app/build/outputs/apk/debug/app-debug.apk)."
            else
              echo "The debug APK file was not produced."
            fi
            if [ "$UPLOAD_OUTCOME" = "success" ]; then
              echo "The GitHub Actions backup artifact named app-debug-apk remains available."
            fi
            {
              echo "## APK Release Warning"
              echo ""
              echo "GitHub Release publishing failed or was skipped (outcome: \`${RELEASE_OUTCOME}\`)."
              if [ "$UPLOAD_OUTCOME" = "success" ]; then
                echo "- The debug APK build succeeded and the backup artifact \`app-debug-apk\` remains available."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
